<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>База отказов ПНК</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --primary: #1e40af;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --entity-bg: #f5f3ff;
      --entity-border: #ddd6fe;
      --entity-accent: #7c3aed;
      --entity-text: #4c1d95;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent-amber: #b45309;
      --accent-amber-bg: #fffbeb;
      --accent-amber-border: #fde68a;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      overscroll-behavior: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.45;
      padding-bottom: 84px;
    }

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 22px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
    }

    .auth-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }

    .auth-sub {
      font-size: 13.5px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 20px;
    }

    .auth-error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 8px;
      max-width: 720px;
      margin: 0 auto;
    }

    .app-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .role-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 20px;
      background: var(--primary-light);
      color: var(--primary);
    }

    .role-badge.readonly {
      background: #f1f5f9;
      color: var(--text-muted);
    }

    .logout-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 4px 16px 10px;
      max-width: 720px;
      margin: 0 auto;
    }

    @media (min-width: 600px) {
      .tabs {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    .tab-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 700;
      padding: 9px 4px;
      border-radius: 10px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .search-wrap {
      padding: 0 16px 10px;
      position: relative;
      max-width: 720px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      height: 44px;
      padding: 0 40px 0 14px;
      font-size: 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text-main);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
      background: var(--surface);
    }

    .clear-search {
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-55%);
      background: #cbd5e1;
      color: #ffffff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .stats-bar {
      padding: 10px 16px 2px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 720px;
      margin: 0 auto;
    }

    .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 5px;
    }

    .live-dot.offline {
      background: #f59e0b;
    }

    .container {
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 720px;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }

    .symptom {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.38;
    }

    .card-meta-top {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .edit-btn {
      flex-shrink: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .blocks-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .entity-box {
      padding: 9px 12px;
      background: var(--entity-bg);
      border-left: 3.5px solid var(--entity-accent);
      border-radius: 8px;
      font-size: 13.5px;
      color: var(--entity-text);
    }

    .entity-label {
      font-weight: 700;
      margin-right: 4px;
    }

    .solution-variant {
      background: var(--primary-light);
      border-left: 3.5px solid var(--primary);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14.5px;
      color: #1e293b;
    }

    .inline-arrow {
      color: var(--primary);
      font-weight: 700;
      padding: 0 3px;
    }

    .tree-branches {
      margin-top: 8px;
      padding-left: 10px;
      border-left: 2px dashed #93c5fd;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tree-branch {
      background: #ffffff;
      border: 1px solid var(--primary-border);
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 13.5px;
      color: #334155;
    }

    .branch-arrow {
      color: var(--primary);
      font-weight: 700;
      margin-right: 4px;
    }

    .note-box {
      padding: 9px 12px;
      background: var(--accent-amber-bg);
      border-left: 3.5px solid #f59e0b;
      border-radius: 8px;
      font-size: 13.5px;
      color: #78350f;
    }

    .note-label {
      font-weight: 700;
      margin-right: 4px;
    }

    .photos-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .photo-thumb {
      width: 76px;
      height: 76px;
      object-fit: cover;
      border-radius: 9px;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    mark {
      background: #fde047;
      color: #0f172a;
      padding: 0 2px;
      border-radius: 3px;
    }

    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(30, 64, 175, 0.35);
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 60;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      overscroll-behavior: none;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--surface);
      width: 100%;
      max-width: 640px;
      max-height: 92vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      border-radius: 20px 20px 0 0;
      padding: 20px 16px 28px;
      transition: transform 0.18s ease-out;
      touch-action: pan-y;
    }

    .modal-sheet.dragging {
      transition: none;
      touch-action: none;
    }

    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; }
      .modal-sheet { border-radius: 16px; margin: 16px; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title { font-size: 18px; font-weight: 700; }

    .close-modal {
      background: var(--bg);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .form-group { margin-bottom: 14px; }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      background: #ffffff;
    }

    .form-control:focus { border-color: var(--primary); }

    #editorModal textarea.form-control {
      resize: none;
      overflow-y: hidden;
      min-height: 44px;
    }

    .similar-box {
      margin-top: 8px;
      background: var(--accent-amber-bg);
      border: 1px solid var(--accent-amber-border);
      border-radius: 10px;
      padding: 10px 12px;
      display: none;
    }

    .similar-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-amber);
      margin-bottom: 6px;
    }

    .similar-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1px solid var(--accent-amber-border);
      border-radius: 8px;
      padding: 7px 9px;
      margin-top: 6px;
    }

    .similar-text {
      font-size: 13px;
      color: var(--text-main);
      font-weight: 500;
    }

    .similar-open-btn {
      flex-shrink: 0;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .editor-block {
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .editor-block.is-entity {
      background: var(--entity-bg);
      border-color: var(--entity-border);
    }

    .editor-block.is-note {
      background: var(--accent-amber-bg);
      border-color: var(--accent-amber-border);
    }

    .editor-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .block-type-tag {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--primary);
    }

    .editor-block.is-entity .block-type-tag { color: var(--entity-accent); }
    .editor-block.is-note .block-type-tag { color: var(--accent-amber); }

    .block-controls { display: flex; gap: 4px; }

    .btn-icon {
      background: #ffffff;
      border: 1px solid var(--border);
      min-width: 28px;
      height: 28px;
      padding: 0 7px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-danger {
      color: #dc2626;
      border-color: #fecaca;
      background: #fef2f2;
    }

    .add-buttons-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .btn-small {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--primary);
    }

    .btn-small.entity-add {
      color: var(--entity-accent);
      border-color: var(--entity-border);
      background: var(--entity-bg);
    }

    .btn-small.note-add {
      color: var(--accent-amber);
      border-color: var(--accent-amber-border);
      background: var(--accent-amber-bg);
    }

    .branch-editor-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      padding-left: 10px;
    }

    .photo-edit-item {
      position: relative;
      display: inline-block;
    }

    .photo-remove-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #dc2626;
      color: #fff;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-primary:disabled, .btn-delete-fault:disabled { opacity: 0.6; }

    .btn-delete-fault {
      width: 100%;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 12px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      display: none;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 10px;
    }

    .loader, .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-title">База отказов ПНК</div>
      <div class="auth-sub">Доступ только для авторизованных пользователей</div>
      <div id="authError" class="auth-error"></div>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="loginEmail" class="form-control" required placeholder="user@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Пароль</label>
          <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" id="loginBtn" class="btn-primary">Войти</button>
      </form>
    </div>
  </div>

  <div id="mainApp" style="display: none;">
    <div class="header">
      <div class="top-bar">
        <div class="app-title">База отказов ПНК</div>
        <div class="top-actions">
          <div id="roleBadge" class="role-badge">Загрузка...</div>
          <button id="logoutBtn" class="logout-btn">Выйти</button>
        </div>
      </div>
      <div class="tabs" id="tabsContainer"></div>
      <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск по выбранной системе..." autocomplete="off">
        <button id="clearSearch" class="clear-search" title="Очистить">×</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">Загрузка данных...</span>
      <span><span id="liveDot" class="live-dot"></span><span id="syncStatusLabel"></span></span>
    </div>

    <div class="container" id="cardsContainer">
      <div class="loader">Загрузка базы отказов...</div>
    </div>

    <button id="fabAdd" class="fab">+ Добавить отказ</button>
  </div>

  <div class="modal-backdrop" id="editorModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Новый отказ</div>
        <button class="close-modal" id="closeModalBtn">×</button>
      </div>

      <input type="hidden" id="editFaultId">

      <div class="form-group">
        <label class="form-label">Система</label>
        <select id="editSystem" class="form-control"></select>
      </div>

      <div class="form-group">
        <label class="form-label">Внешнее проявление отказа</label>
        <textarea id="editSymptom" class="form-control" rows="2"></textarea>
        <div id="similarBox" class="similar-box">
          <div class="similar-title">Похожие отказы в этой системе:</div>
          <div id="similarList"></div>
        </div>
      </div>

      <div class="form-group">
        <div id="blocksEditorList"></div>
        <div class="add-buttons-row">
          <button type="button" class="btn-small" id="addVariantBtn">+ Способ устранения</button>
          <button type="button" class="btn-small note-add" id="addNoteBtn">+ Примечание</button>
          <button type="button" class="btn-small entity-add" id="addEntityBtn">+ Сущность</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Добавить фото</label>
        <div id="photosEditorList" class="photos-row" style="margin-bottom:8px;"></div>
        <input type="file" id="photoFileInput" accept="image/*" multiple style="display:none;">
        <button type="button" class="btn-small" id="uploadPhotoBtn">+ Прикрепить фото</button>
      </div>

      <button type="button" class="btn-primary" id="saveFaultBtn">Сохранить в базу</button>
      <button type="button" class="btn-delete-fault" id="deleteFaultBtn">Удалить этот отказ</button>
    </div>
  </div>

  <div id="lightbox" class="lightbox" onclick="this.classList.remove('open')">
    <img id="lightboxImg" src="" alt="">
  </div>

  <script>
    // =========================================================================
    // ВСТАВЬТЕ СЮДА ВАШИ ДАННЫЕ ИЗ SUPABASE
    // =========================================================================
    const SUPABASE_URL = 'https://bjnrtoqawetgnimnffud.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_t0FNkzyiUC7q5GAdnM484w_TQvA5Zm9';
    // =========================================================================

    const CACHE_KEY = 'pnk_faults_cache_v6';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let APP_STATE = {
      systems: ['КП1', 'КП2', 'КП3', 'ДИСС', 'С3М', 'МСН'],
      currentSystem: 'КП1',
      canEdit: false,
      userEmail: '',
      userName: '',
      roleNames: {},
      faults: [],
      editPhotos: []
    };

    let realtimeChannel = null;

    function scrollListToTop() {
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function autoResizeTextarea(el) {
      if (!el || el.tagName !== 'TEXTAREA') return;
      el.style.height = 'auto';
      el.style.height = `${el.scrollHeight}px`;
    }

    function autoResizeAllEditorTextareas() {
      document.querySelectorAll('#editorModal textarea.form-control').forEach(autoResizeTextarea);
    }

    document.getElementById('editorModal').addEventListener('input', (e) => {
      if (e.target && e.target.tagName === 'TEXTAREA') {
        autoResizeTextarea(e.target);
      }
    });

    function formatAuthorName(rawValue) {
      if (!rawValue) return '';
      const trimmed = String(rawValue).trim();
      if (!trimmed.includes('@')) return trimmed;
      const localPart = trimmed.split('@')[0];
      return localPart || trimmed;
    }

    function resolveAuthorLabel(rawAuthor) {
      if (!rawAuthor) return '';
      const key = String(rawAuthor).trim().toLowerCase();
      if (APP_STATE.roleNames[key]) return APP_STATE.roleNames[key];
      return formatAuthorName(rawAuthor);
    }

    async function loadRoleNamesMap() {
      const { data, error } = await sb
        .from('user_roles')
        .select('email, display_name');
      if (!error && Array.isArray(data)) {
        const map = {};
        data.forEach(row => {
          if (row.email) {
            const cleanName = (row.display_name || '').trim();
            map[row.email.trim().toLowerCase()] = cleanName || formatAuthorName(row.email);
          }
        });
        APP_STATE.roleNames = map;
        saveCache();
      }
    }

    function renderMainShell() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      applyRoleBadge();
      renderTabs();
      renderCards();
    }

    
    async function checkSession() {
      const cached = loadCache();
      const hasCache = cached &&
        Array.isArray(cached.faults) &&
        cached.faults.length > 0;

      // Сразу показываем сохранённую копию, пока проверяется авторизация.
      if (hasCache) {
        APP_STATE.canEdit = Boolean(cached.canEdit);
        APP_STATE.userEmail = cached.userEmail || '';
        APP_STATE.userName = cached.userName || '';
        APP_STATE.roleNames = cached.roleNames || {};
        APP_STATE.faults = cached.faults;

        setSyncStatus(false, 'Кэш • проверка авторизации...');
        renderMainShell();
      }

      try {
        // Не позволяем проверке сессии зависнуть бесконечно.
        const sessionResult = await Promise.race([
          sb.auth.getSession(),
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error('Время ожидания авторизации истекло')), 12000)
          )
        ]);

        if (sessionResult.error) {
          throw sessionResult.error;
        }

        const session = sessionResult.data?.session;

        if (session && session.user) {
          await initAuthorizedApp(session.user);
          return;
        }

        if (hasCache) {
          setSyncStatus(false, 'Кэш • нажмите «Выйти» для повторного входа');
        } else {
          showAuthScreen('Войдите в систему для загрузки базы.');
        }

      } catch (error) {
        console.warn('Ошибка восстановления сессии:', error);

        if (hasCache) {
          setSyncStatus(false, 'Офлайн-копия • нажмите «Выйти» для входа');
        } else {
          showAuthScreen(
            'Не удалось проверить авторизацию. Проверьте подключение и попробуйте ещё раз.'
          );
        }
      }
    }

      const errBox = document.getElementById('authError');

    async function initAuthorizedApp(user) {
      APP_STATE.userEmail = user.email;
      const metaName = (user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name)) || '';
      APP_STATE.userName = metaName.trim() || formatAuthorName(user.email);

      const { data: roleRow, error: roleErr } = await sb
        .from('user_roles')
        .select('role, display_name')
        .eq('email', user.email)
        .maybeSingle();

      const cached = loadCache();
      if (roleErr && cached && Array.isArray(cached.faults)) {
        APP_STATE.canEdit = cached.canEdit || false;
        APP_STATE.faults = cached.faults || [];
        APP_STATE.roleNames = cached.roleNames || {};
        setSyncStatus(false, 'Офлайн-копия');
        renderMainShell();
        return;
      }

      if (!roleRow) {
        await sb.auth.signOut();
        showAuthScreen('Вашему аккаунту не предоставлен доступ к этой базе.');
        return;
      }

      if (roleRow.display_name && roleRow.display_name.trim()) {
        APP_STATE.userName = roleRow.display_name.trim();
      }
      APP_STATE.canEdit = roleRow.role === 'editor';
      saveCache();
      renderMainShell();

      await Promise.all([loadRoleNamesMap(), loadAllFaults()]);
      subscribeRealtime();
    }

    function saveCache() {

          userName: APP_STATE.userName,

    function getFaultTimestamp(item) {
      const raw = item.updated_at || item.created_at || '';
      const ts = raw ? Date.parse(raw) : NaN;
      if (!isNaN(ts)) return ts;
      return Number(item.id) || 0;
    }

    function sortFaultsNewestFirst(items) {
      return (items || []).slice().sort((a, b) => {
        const diff = getFaultTimestamp(b) - getFaultTimestamp(a);
        if (diff !== 0) return diff;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });
    }

    async function loadAllFaults() {
      const { data, error } = await sb
        .from('faults')
        .select('*')
        .order('id', { ascending: true });

      if (error) {
        const cached = loadCache();
        if (cached && cached.faults) {
          APP_STATE.faults = cached.faults;
          APP_STATE.roleNames = cached.roleNames || {};
          setSyncStatus(false, 'Офлайн-копия');
          renderCards();
        } else {
          document.getElementById('cardsContainer').innerHTML =
            `<div class="empty-state">Ошибка загрузки: ${escapeHtml(error.message)}</div>`;
        }
        return;
      }

      APP_STATE.faults = data || [];
      saveCache();
      setSyncStatus(true, APP_STATE.userName || APP_STATE.userEmail);
      renderCards();
    }

    function subscribeRealtime() {
      if (realtimeChannel) sb.removeChannel(realtimeChannel);

      realtimeChannel = sb
        .channel('faults-live-sync')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'faults' }, (payload) => {
          if (payload.eventType === 'INSERT') {
            if (!APP_STATE.faults.some(f => f.id === payload.new.id)) {
              APP_STATE.faults.push(payload.new);
            }
          } else if (payload.eventType === 'UPDATE') {
            const idx = APP_STATE.faults.findIndex(f => f.id === payload.new.id);
            if (idx !== -1) APP_STATE.faults[idx] = payload.new;
          } else if (payload.eventType === 'DELETE') {
            APP_STATE.faults = APP_STATE.faults.filter(f => f.id !== payload.old.id);
          }
          saveCache();
          renderCards();
        })
        .subscribe();
    }

    function stemRu(word) {
      word = word.toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z0-9-]/g, '');
      if (word.length < 4) return word;
      const rvMatch = word.match(/[аеиоуыэюя]/);
      if (!rvMatch) return word;
      const start = rvMatch.index + 1;
      const head = word.slice(0, start);
      let rv = word.slice(start);

      const perfective = /(ив|ивши|ившись|ыв|ывши|ывшись|вши|вшись)$/;
      const reflexive = /(ся|сь)$/;
      const adjective = /(ее|ие|ые|ое|ими|ыми|ей|ий|ый|ой|ем|им|ым|ом|его|ого|ему|ому|их|ых|ую|юю|ая|яя|ою|ею)$/;
      const participle = /(ем|нн|вш|ющ|щ)$/;
      const verb = /(ила|ыла|ена|ейте|уйте|ите|или|ыли|ей|уй|ил|ыл|им|ым|ен|ило|ыло|ено|ят|ует|уют|ит|ыт|ены|ить|ыть|ишь|ую|ю)$/;
      const noun = /(а|ев|ов|ие|ье|е|иями|ями|ами|еи|ии|и|ией|ей|ой|ий|й|иям|ям|ием|ем|ам|ом|о|у|ах|иях|ях|ы|ь|ию|ью|ю|ия|ья|я)$/;

      if (perfective.test(rv)) {
        rv = rv.replace(perfective, '');
      } else {
        rv = rv.replace(reflexive, '');
        if (adjective.test(rv)) {
          rv = rv.replace(adjective, '');
          rv = rv.replace(participle, '');
        } else if (verb.test(rv)) {
          rv = rv.replace(verb, '');
        } else {
          rv = rv.replace(noun, '');
        }
      }
      rv = rv.replace(/и$/, '');
      rv = rv.replace(/(ость|ост)$/, '');
      rv = rv.replace(/ь$/, '');
      rv = rv.replace(/нн$/, 'н');
      return head + rv;
    }

    function normalizeText(str) {
      return str.toLowerCase().replace(/ё/g, 'е');
    }

    function matchesQuery(item, query) {
      if (!query.trim()) return true;
      const cleanSol = (item.solution || '')
        .replace(/\[ПРИМ\]/gi, ' ')
        .replace(/\[СУЩ\]/gi, ' ')
        .replace(/\[Р:-?\d+\]/gi, ' ');
      const fullText = normalizeText(`${item.symptom} ${cleanSol} ${item.note || ''}`);
      const textWords = fullText.split(/[^а-яa-z0-9-]+/).filter(Boolean);
      const textStems = textWords.map(stemRu);

      const queryTokens = normalizeText(query).split(/\s+/).filter(Boolean);
      return queryTokens.every(token => {
        const qStem = stemRu(token);
        return textWords.some((w, idx) => w.includes(token) || (qStem.length >= 3 && textStems[idx].startsWith(qStem)));
      });
    }

    function highlightText(rawText, query) {
      let escaped = escapeHtml(rawText);
      escaped = escaped.replace(/-&gt;/g, '<span class="inline-arrow">➔</span>');

      if (!query.trim()) return escaped;
      const tokens = normalizeText(query).split(/\s+/).filter(t => t.length >= 2);
      if (!tokens.length) return escaped;

      const stems = tokens.map(stemRu);
      return escaped.replace(/(<[^>]+>)|([а-яА-ЯёЁa-zA-Z0-9-]+)/g, (full, tag, word) => {
        if (tag) return tag;
        const norm = normalizeText(word);
        const mStem = stemRu(norm);
        const hit = tokens.some((t, i) => norm.includes(t) || (stems[i].length >= 3 && mStem.startsWith(stems[i])));
        return hit ? `<mark>${word}</mark>` : word;
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function extractKeywords(text) {
      const stopWords = new Set(['нет', 'не', 'при', 'на', 'в', 'во', 'из', 'по', 'со', 'от', 'до', 'или', 'и', 'а', 'но', 'что', 'то', 'же', 'бы', 'ли']);
      const words = normalizeText(text).split(/[^а-яa-z0-9-]+/).filter(w => w.length >= 2 && !stopWords.has(w));
      return words.map(w => stemRu(w).length >= 3 ? stemRu(w) : w);
    }

    function checkSimilarFaults() {
      const faultId = document.getElementById('editFaultId').value;
      const box = document.getElementById('similarBox');
      const listEl = document.getElementById('similarList');

      if (faultId) {
        box.style.display = 'none';
        return;
      }

      const inputSymptom = document.getElementById('editSymptom').value.trim();
      const targetSystem = document.getElementById('editSystem').value;
      const inputKeys = [...new Set(extractKeywords(inputSymptom))];

      if (inputKeys.length < 2) {
        box.style.display = 'none';
        return;
      }

      const candidates = APP_STATE.faults
        .filter(f => f.system === targetSystem)
        .map(f => {
          const itemKeys = [...new Set(extractKeywords(f.symptom))];
          if (!itemKeys.length) return null;
          let matched = 0;
          inputKeys.forEach(ik => {
            if (itemKeys.some(ok => ok === ik || (ik.length >= 4 && ok.startsWith(ik)) || (ok.length >= 4 && ik.startsWith(ok)))) {
              matched++;
            }
          });
          const score = matched / Math.max(inputKeys.length, itemKeys.length);
          return { item: f, matched, score };
        })
        .filter(x => x && x.matched >= 2 && x.score >= 0.45)
        .sort((a, b) => b.score - a.score)
        .slice(0, 3);

      if (!candidates.length) {
        box.style.display = 'none';
        return;
      }

      listEl.innerHTML = candidates.map(c => `
        <div class="similar-item">
          <div class="similar-text">${escapeHtml(c.item.symptom)}</div>
          <button type="button" class="similar-open-btn" onclick="openEditor(${c.item.id})">Открыть и дополнить</button>
        </div>
      `).join('');

      box.style.display = 'block';
    }

    document.getElementById('editSymptom').addEventListener('input', checkSimilarFaults);
    document.getElementById('editSystem').addEventListener('change', checkSimilarFaults);

    function stripLegacyRating(raw) {
      return String(raw || '').replace(/\s*\[Р:-?\d+\]\s*$/i, '').trim();
    }

    function parseCardBlocks(solutionText, legacyNoteText) {
      const blocks = [];
      let currentVariant = null;

      if (solutionText) {
        const lines = solutionText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

        lines.forEach(line => {
          if (/^\[ПРИМ\]/i.test(line)) {
            if (currentVariant) {
              blocks.push(currentVariant);
              currentVariant = null;
            }
            blocks.push({ type: 'note', text: line.replace(/^\[ПРИМ\]\s*/i, '') });
          } else if (/^\[СУЩ\]/i.test(line)) {
            if (currentVariant) {
              blocks.push(currentVariant);
              currentVariant = null;
            }
            blocks.push({ type: 'entity', text: line.replace(/^\[СУЩ\]\s*/i, '') });
          } else if (line.startsWith('*')) {
            if (currentVariant) blocks.push(currentVariant);
            currentVariant = {
              type: 'variant',
              title: stripLegacyRating(line.replace(/^\*+\s*/, '')),
              branches: []
            };
          } else if (line.startsWith('->') || line.startsWith('→')) {
            if (!currentVariant) {
              currentVariant = {
                type: 'variant',
                title: '',
                branches: []
              };
            }
            currentVariant.branches.push(line.replace(/^(->|→)\s*/, ''));
          } else {
            if (currentVariant) blocks.push(currentVariant);
            currentVariant = {
              type: 'variant',
              title: stripLegacyRating(line),
              branches: []
            };
          }
        });

        if (currentVariant) blocks.push(currentVariant);
      }

      if (legacyNoteText && legacyNoteText.trim()) {
        legacyNoteText.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(nLine => {
          blocks.push({ type: 'note', text: nLine.replace(/^\[ПРИМ\]\s*/i, '') });
        });
      }

      return blocks;
    }

    function serializeBlocksToSolution(blocks) {
      const lines = [];
      blocks.forEach(block => {
        if (block.type === 'entity') {
          if (block.text) {
            block.text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(line => {
              lines.push(`[СУЩ] ${line}`);
            });
          }
        } else if (block.type === 'note') {
          if (block.text) {
            block.text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(line => {
              lines.push(`[ПРИМ] ${line}`);
            });
          }
        } else {
          if (block.title) {
            lines.push(`* ${block.title.replace(/\r?\n+/g, ' ')}`);
          } else if (block.branches && block.branches.length) {
            lines.push('* Способ устранения');
          }
          (block.branches || []).forEach(b => lines.push(`-> ${b}`));
        }
      });
      return lines.join('\n');
    }

    function parsePhotos(photosStr) {
      if (!photosStr) return [];
      return photosStr.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    }

    function extractStoragePathFromUrl(url) {
      if (!url) return '';
      const marker = '/fault-photos/';
      const idx = url.indexOf(marker);
      if (idx === -1) return '';
      return decodeURIComponent(url.slice(idx + marker.length).split('?')[0]);
    }

    async function deletePhotosFromStorage(urls) {
      const paths = (urls || [])
        .map(extractStoragePathFromUrl)
        .filter(Boolean);
      if (!paths.length) return;

      const { error } = await sb.storage.from('fault-photos').remove(paths);
      if (error) {
        console.warn('Не удалось удалить файлы из fault-photos:', error.message);
      }
    }

    function formatDateTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').classList.add('open');
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      const query = document.getElementById('searchInput').value;
      const list = sortFaultsNewestFirst(
        APP_STATE.faults.filter(item => item.system === APP_STATE.currentSystem)
      );
      const filtered = list.filter(item => matchesQuery(item, query));

      document.getElementById('statsCount').textContent =
        query.trim()
          ? `Найдено в ${APP_STATE.currentSystem}: ${filtered.length} из ${list.length}`
          : `Всего в ${APP_STATE.currentSystem}: ${list.length}`;

      if (!filtered.length) {
        container.innerHTML = `<div class="empty-state">По вашему запросу в системе <b>${APP_STATE.currentSystem}</b> ничего не найдено.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const blocks = parseCardBlocks(item.solution, item.note);
        const photos = parsePhotos(item.photos);

        const blocksHtml = blocks.map(block => {
          if (block.type === 'entity') {
            return `<div class="entity-box"><span class="entity-label">Сущность:</span>${highlightText(block.text, query)}</div>`;
          }

          if (block.type === 'note') {
            return `<div class="note-box"><span class="note-label">Примечание:</span>${highlightText(block.text, query)}</div>`;
          }

          const branchesHtml = block.branches.length
            ? `<div class="tree-branches">
                ${block.branches.map(b => `<div class="tree-branch"><span class="branch-arrow">↳</span>${highlightText(b, query)}</div>`).join('')}
               </div>`
            : '';

          return `
            <div class="solution-variant">
              ${block.title ? `<div class="solution-variant-title">${highlightText(block.title, query)}</div>` : ''}
              ${branchesHtml}
            </div>
          `;
        }).join('');

        const photosHtml = photos.length
          ? `<div class="photos-row">
              ${photos.map(url => `<img class="photo-thumb" src="${escapeHtml(url)}" onclick="openLightbox('${escapeHtml(url)}')" loading="lazy">`).join('')}
             </div>`
          : '';

        const dt = formatDateTime(item.updated_at);
        const authorLabel = resolveAuthorLabel(item.updated_by);
        const metaTopHtml = (authorLabel || dt)
          ? `<div class="card-meta-top">Обновлено: ${escapeHtml(dt)}${authorLabel ? ` • ${escapeHtml(authorLabel)}` : ''}</div>`
          : '';

        const editBtnHtml = APP_STATE.canEdit
          ? `<button class="edit-btn" onclick="openEditor(${item.id})">Изменить</button>`
          : '';

        return `
          <div class="card">
            <div class="card-header">
              <div class="symptom">${highlightText(item.symptom, query)}</div>
              ${editBtnHtml}
            </div>
            ${metaTopHtml}
            <div class="blocks-list">${blocksHtml}</div>
            ${photosHtml}
          </div>
        `;
      }).join('');
    }

    function moveEditorBlock(btn, direction) {
      const block = btn.closest('.editor-block');
      const parent = block.parentElement;
      if (direction === -1 && block.previousElementSibling) {
        parent.insertBefore(block, block.previousElementSibling);
      } else if (direction === 1 && block.nextElementSibling) {
        parent.insertBefore(block.nextElementSibling, block);
      }
      requestAnimationFrame(autoResizeAllEditorTextareas);
    }

    function createNoteEditorBlock(text = '') {
      const div = document.createElement('div');

      div.dataset.type = 'note';
      div.innerHTML = `
        <div class="editor-block-header">
          <span class="block-type-tag">Примечание</span>
          <div class="block-controls">
            <button type="button" class="btn-icon" onclick="moveEditorBlock(this, -1)">↑</button>
            <button type="button" class="btn-icon" onclick="moveEditorBlock(this, 1)">↓</button>
            <button type="button" class="btn-icon btn-danger" onclick="this.closest('.editor-block').remove()">✕</button>
          </div>
        </div>
        <textarea class="form-control note-text-input" rows="1">${escapeHtml(text)}</textarea>
      `;
      return div;
    }

    function addBranchInput(container, text = '') {
      const row = document.createElement('div');
      row.className = 'branch-editor-row';
      row.innerHTML = `
        <input type="text" class="form-control branch-input" style="font-size:13.5px; padding:7px 10px;" value="${escapeHtml(text)}">
        <button type="button" class="btn-icon btn-danger" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(row);
    }

    function renderEditorPhotos() {
      const list = document.getElementById('photosEditorList');
      list.innerHTML = APP_STATE.editPhotos.map((url, idx) => `
        <div class="photo-edit-item">
          <img class="photo-thumb" src="${escapeHtml(url)}">
          <button type="button" class="photo-remove-btn" onclick="removeEditorPhoto(${idx})">×</button>
        </div>
      `).join('');
    }

    function removeEditorPhoto(idx) {
      APP_STATE.editPhotos.splice(idx, 1);
      renderEditorPhotos();
    }

    document.getElementById('uploadPhotoBtn').onclick = () => {
      document.getElementById('photoFileInput').click();
    };

    document.getElementById('photoFileInput').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      const btn = document.getElementById('uploadPhotoBtn');
      btn.disabled = true;
      btn.textContent = 'Загрузка фото...';

      const safeFolder = String(APP_STATE.currentSystem || 'common')
        .replace(/[^a-zA-Z0-9_-]/g, '') || 'common';

      for (const file of files) {
        const rawMimeExt = (file.type && file.type.split('/')[1]) || '';
        const cleanMimeExt = rawMimeExt.split(';')[0].replace(/[^a-z0-9]/gi, '').toLowerCase();
        const rawNameExt = (file.name && file.name.includes('.') ? file.name.split('.').pop() : '')
          .replace(/[^a-z0-9]/gi, '').toLowerCase();
        const ext = (cleanMimeExt === 'jpeg' ? 'jpg' : cleanMimeExt) || rawNameExt || 'jpg';

        const fileName = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const filePath = `${safeFolder}/${fileName}`;

        const { error } = await sb.storage
          .from('fault-photos')
          .upload(filePath, file, {
            cacheControl: '3600',
            upsert: false,
            contentType: file.type || `image/${ext}`
          });

        if (error) {
          alert('Ошибка загрузки фото: ' + error.message);
          continue;
        }

        const { data } = sb.storage.from('fault-photos').getPublicUrl(filePath);
        if (data && data.publicUrl) {
          APP_STATE.editPhotos.push(data.publicUrl);
        }
      }

      btn.disabled = false;
      btn.textContent = '+ Прикрепить фото';
      e.target.value = '';
      renderEditorPhotos();
    });

    function openEditor(faultId = null) {
      const modal = document.getElementById('editorModal');
      const sheet = modal.querySelector('.modal-sheet');
      sheet.style.transform = '';
      sheet.scrollTop = 0;
      const sysSelect = document.getElementById('editSystem');
      const deleteBtn = document.getElementById('deleteFaultBtn');
      sysSelect.innerHTML = APP_STATE.systems.map(s => `<option value="${s}">${s}</option>`).join('');
      sysSelect.value = APP_STATE.currentSystem;

      const blocksList = document.getElementById('blocksEditorList');
      blocksList.innerHTML = '';
      document.getElementById('similarBox').style.display = 'none';

      if (faultId) {
        const item = APP_STATE.faults.find(x => x.id === faultId);
        document.getElementById('modalTitle').textContent = 'Редактировать отказ';
        document.getElementById('editFaultId').value = faultId;
        document.getElementById('editSymptom').value = item.symptom;
        sysSelect.value = item.system;
        deleteBtn.style.display = 'block';
        APP_STATE.editPhotos = parsePhotos(item.photos);

        const parsedBlocks = parseCardBlocks(item.solution, item.note);
        if (parsedBlocks.length) {
          parsedBlocks.forEach(b => {
            if (b.type === 'entity') {
              blocksList.appendChild(createEntityEditorBlock(b.text));
            } else if (b.type === 'note') {
              blocksList.appendChild(createNoteEditorBlock(b.text));
            } else {
              blocksList.appendChild(createVariantEditorBlock(b.title, b.branches));
            }
          });
        } else {
          blocksList.appendChild(createVariantEditorBlock());
        }
      } else {
        document.getElementById('modalTitle').textContent = 'Новый отказ';
        document.getElementById('editFaultId').value = '';
        document.getElementById('editSymptom').value = '';
        deleteBtn.style.display = 'none';
        APP_STATE.editPhotos = [];
        blocksList.appendChild(createVariantEditorBlock());
      }

      renderEditorPhotos();
      modal.classList.add('open');
      requestAnimationFrame(autoResizeAllEditorTextareas);
    }

    document.getElementById('addEntityBtn').onclick = () => {
      const block = createEntityEditorBlock();
      document.getElementById('blocksEditorList').appendChild(block);
      requestAnimationFrame(() => autoResizeTextarea(block.querySelector('textarea')));
    };

    document.getElementById('addVariantBtn').onclick = () => {
      const block = createVariantEditorBlock();
      document.getElementById('blocksEditorList').appendChild(block);
      requestAnimationFrame(() => autoResizeTextarea(block.querySelector('textarea')));
    };

    document.getElementById('addNoteBtn').onclick = () => {
      const block = createNoteEditorBlock();
      document.getElementById('blocksEditorList').appendChild(block);
      requestAnimationFrame(() => autoResizeTextarea(block.querySelector('textarea')));
    };

    document.getElementById('closeModalBtn').onclick = () => {
      document.getElementById('editorModal').classList.remove('open');
    };

    document.getElementById('fabAdd').onclick = () => openEditor(null);

    // --- Блокировка прокрутки фона и закрытие окна свайпом от края ---
    (function initModalScrollAndSwipe() {
      const backdrop = document.getElementById('editorModal');
      const sheet = backdrop.querySelector('.modal-sheet');
      const MIN_EDGE = 16;
      const MAX_EDGE = 68;
      const SWIPE_THRESHOLD = 75;

      let startX = 0;
      let startY = 0;
      let lastY = 0;
      let deltaX = 0;
      let isEdgeSwipe = false;
      let isDecided = false;

      backdrop.addEventListener('touchmove', (e) => {
        if (!backdrop.classList.contains('open')) return;
        if (!sheet.contains(e.target)) {
          if (e.cancelable) e.preventDefault();
        }
      }, { passive: false });

      sheet.addEventListener('touchstart', (e) => {
        if (!backdrop.classList.contains('open') || e.touches.length !== 1) return;
        const touch = e.touches[0];
        const vw = window.innerWidth || document.documentElement.clientWidth;
        const nearLeft = touch.clientX >= MIN_EDGE && touch.clientX <= MAX_EDGE;
        const nearRight = touch.clientX >= vw - MAX_EDGE && touch.clientX <= vw - MIN_EDGE;

        startX = touch.clientX;
        startY = touch.clientY;
        lastY = touch.clientY;
        deltaX = 0;
        isEdgeSwipe = nearLeft || nearRight;
        isDecided = false;
      }, { passive: true });

      sheet.addEventListener('touchmove', (e) => {
        if (!backdrop.classList.contains('open') || e.touches.length !== 1) return;
        const touch = e.touches[0];
        const currentDeltaX = touch.clientX - startX;
        const currentDeltaY = touch.clientY - startY;
        const stepY = touch.clientY - lastY;
        lastY = touch.clientY;

        if (!isDecided && (Math.abs(currentDeltaX) >= 10 || Math.abs(currentDeltaY) >= 10)) {
          isDecided = true;
          if (isEdgeSwipe && Math.abs(currentDeltaX) > Math.abs(currentDeltaY) * 1.15) {
            sheet.classList.add('dragging');
          } else {
            isEdgeSwipe = false;
          }
        }

        if (isEdgeSwipe && sheet.classList.contains('dragging')) {
          deltaX = currentDeltaX;
          if (e.cancelable) e.preventDefault();
          sheet.style.transform = `translateX(${deltaX}px)`;
          return;
        }

        const atTop = sheet.scrollTop <= 0;
        const atBottom = sheet.scrollTop + sheet.clientHeight >= sheet.scrollHeight - 1;
        if ((atTop && stepY > 0) || (atBottom && stepY < 0)) {
          if (e.cancelable) e.preventDefault();
        }
      }, { passive: false });

      function finishSwipe() {
        if (!isEdgeSwipe) return;
        sheet.classList.remove('dragging');

        if (Math.abs(deltaX) >= SWIPE_THRESHOLD) {
          const direction = deltaX > 0 ? 1 : -1;
          sheet.style.transform = `translateX(${direction * window.innerWidth}px)`;
          setTimeout(() => {
            backdrop.classList.remove('open');
            sheet.style.transform = '';
          }, 160);
        } else {
          sheet.style.transform = '';
        }

        isEdgeSwipe = false;
        isDecided = false;
        deltaX = 0;
      }

      sheet.addEventListener('touchend', finishSwipe);
      sheet.addEventListener('touchcancel', finishSwipe);
    })();

    document.getElementById('saveFaultBtn').onclick = async function() {
      const btn = this;
      const symptom = document.getElementById('editSymptom').value.trim();
      if (!symptom) {
        alert('Укажите внешнее проявление отказа');
        return;
      }

      const editorBlocks = Array.from(document.querySelectorAll('#blocksEditorList .editor-block'));
      const serializedBlocks = [];

      editorBlocks.forEach(block => {
        if (block.dataset.type === 'entity') {
          const entityVal = block.querySelector('.entity-text-input').value.trim();
          if (entityVal) {
            serializedBlocks.push({ type: 'entity', text: entityVal });
          }
        } else if (block.dataset.type === 'note') {
          const noteVal = block.querySelector('.note-text-input').value.trim();
          if (noteVal) {
            serializedBlocks.push({ type: 'note', text: noteVal });
          }
        } else {
          const title = block.querySelector('.variant-title-input').value.trim();
          const branches = Array.from(block.querySelectorAll('.branch-input'))
            .map(inp => inp.value.trim())
            .filter(Boolean);

          if (title || branches.length) {
            serializedBlocks.push({ type: 'variant', title, branches });
          }
        }
      });

      const solutionStr = serializeBlocksToSolution(serializedBlocks);

      if (!solutionStr.trim() && !APP_STATE.editPhotos.length) {
        alert('Добавьте хотя бы сущность, способ устранения, примечание или фото');
        return;
      }

      const faultId = document.getElementById('editFaultId').value;
      const previousFault = faultId ? APP_STATE.faults.find(f => f.id === Number(faultId)) : null;
      const previousPhotos = previousFault ? parsePhotos(previousFault.photos) : [];
      const removedPhotos = previousPhotos.filter(url => !APP_STATE.editPhotos.includes(url));

      const record = {
        system: document.getElementById('editSystem').value,
        symptom: symptom,
        solution: solutionStr,
        note: '',
        photos: APP_STATE.editPhotos.join('\n'),
        updated_by: APP_STATE.userName || APP_STATE.userEmail,
        updated_at: new Date().toISOString()
      };

      btn.disabled = true;
      btn.textContent = 'Сохранение...';

      let res;
      if (faultId) {
        res = await sb.from('faults').update(record).eq('id', Number(faultId)).select().single();
      } else {
        res = await sb.from('faults').insert(record).select().single();
      }

      btn.disabled = false;
      btn.textContent = 'Сохранить в базу';

      if (res.error) {
        alert('Ошибка сохранения: ' + res.error.message);
        return;
      }

      if (removedPhotos.length) {
        await deletePhotosFromStorage(removedPhotos);
      }

      if (faultId) {
        const idx = APP_STATE.faults.findIndex(f => f.id === Number(faultId));
        if (idx !== -1) APP_STATE.faults[idx] = res.data;
      } else if (!APP_STATE.faults.some(f => f.id === res.data.id)) {
        APP_STATE.faults.push(res.data);
      }

      saveCache();
      document.getElementById('editorModal').classList.remove('open');
      renderCards();
    };

    document.getElementById('deleteFaultBtn').onclick = async function() {
      const faultId = document.getElementById('editFaultId').value;
      if (!faultId) return;

      if (!confirm('Точно удалить этот отказ из базы? Это действие нельзя отменить.')) {
        return;
      }

      const faultToDelete = APP_STATE.faults.find(f => f.id === Number(faultId));
      const photosToDelete = faultToDelete ? parsePhotos(faultToDelete.photos) : [];

      const btn = this;
      const saveBtn = document.getElementById('saveFaultBtn');
      btn.disabled = true;
      saveBtn.disabled = true;
      btn.textContent = 'Удаление...';

      const { error } = await sb.from('faults').delete().eq('id', Number(faultId));

      btn.disabled = false;
      saveBtn.disabled = false;
      btn.textContent = 'Удалить этот отказ';

      if (error) {
        alert('Ошибка удаления: ' + error.message);
        return;
      }

      if (photosToDelete.length) {
        await deletePhotosFromStorage(photosToDelete);
      }

      APP_STATE.faults = APP_STATE.faults.filter(f => f.id !== Number(faultId));
      saveCache();
      document.getElementById('editorModal').classList.remove('open');
      renderCards();
    };

    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');

    searchInput.addEventListener('input', () => {
      clearSearch.style.display = searchInput.value ? 'flex' : 'none';
      renderCards();
      scrollListToTop();
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      clearSearch.style.display = 'none';
      renderCards();
      searchInput.focus();
      scrollListToTop();
    });

    checkSession();
  </script>
